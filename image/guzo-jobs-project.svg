<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg-guzo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f11;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg-guzo)"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="800" height="50" fill="#141416"/>
  <rect x="20" y="15" width="80" height="10" rx="4" fill="#e4e4e7" opacity="0.9"/>
  <rect x="720" y="15" width="60" height="10" rx="4" fill="#6b6b70"/>

  <!-- Map area -->
  <rect x="0" y="60" width="500" height="440" fill="#1f1f22"/>

  <!-- Map header -->
  <rect x="20" y="70" width="200" height="10" rx="3" fill="#6b6b70" transform="rotate(-0 120 75)"/>

  <!-- Map controls -->
  <rect x="20" y="100" width="60" height="60" rx="6" fill="#141416" stroke="#b1b493" stroke-width="1"/>
  <rect x="30" y="115" width="40" height="4" rx="2" fill="#6b6b70"/>
  <rect x="30" y="125" width="20" height="4" rx="2" fill="#6b6b70"/>
  <rect x="30" y="135" width="30" height="4" rx="2" fill="#6b6b70"/>
  <rect x="30" y="145" width="8" height="20" rx="2" fill="#b1b493"/>

  <!-- Route path (dashed line) -->
  <path d="M50 180 Q100 200 150 220 T250 260 T350 300 T450 340" stroke="#b1b493" stroke-width="3" fill="none" stroke-dasharray="8,4"/>

  <!-- Origin marker -->
  <circle cx="45" cy="175" r="8" fill="#b1b493"/>
  <circle cx="45" cy="175" r="4" fill="#141416"/>

  <!-- Destination marker -->
  <circle cx="445" cy="335" r="8" fill="#b1b493"/>
  <rect x="438" y="328" width="14" height="14" rx="2" fill="#141416"/>

  <!-- Delivery request card overlay -->
  <rect x="20" y="370" width="460" height="90" rx="10" fill="#141416"/>
  <rect x="40" y="385" width="80" height="8" rx="3" fill="#e4e4e7" opacity="0.9"/>
  <rect x="40" y="400" width="200" height="12" rx="4" fill="#6b6b70"/>
  <rect x="40" y="420" width="180" height="8" rx="3" fill="#6b6b70"/>

  <!-- Status badge -->
  <rect x="380" y="385" width="60" height="24" rx="6" fill="#b1b493"/>
  <rect x="385" y="395" width="50" height="4" rx="2" fill="#141416"/>
  <rect x="385" y="403" width="30" height="4" rx="2" fill="#141416"/>

  <!-- Package info -->
  <rect x="330" y="410" width="40" height="40" rx="6" fill="#1f1f22"/>
  <rect x="340" y="420" width="20" height="20" rx="3" fill="#6b6b70"/>
  <rect x="340" y="445" width="20" height="4" rx="2" fill="#6b6b70"/>

  <!-- Right panel: Delivery details -->
  <rect x="510" y="60" width="290" height="440" rx="12" fill="#1a1a1d"/>

  <!-- Delivery progress -->
  <rect x="530" y="90" width="250" height="10" rx="5" fill="#141416"/>
  <rect x="530" y="115" width="250" height="4" rx="2" fill="#6b6b70"/>

  <!-- Delivery steps -->
  <circle cx="535" cy="140" r="12" fill="#b1b493"/>
  <rect x="528" y="148" width="14" height="4" rx="2" fill="#141416"/>
  <rect x="535" y="137" width="6" height="14" rx="3" fill="#141416"/>
  <rect x="555" y="136" width="200" height="10" rx="3" fill="#e4e4e7" opacity="0.9"/>
  <rect x="555" y="152" width="150" height="8" rx="3" fill="#6b6b70"/>

  <circle cx="535" cy="175" r="12" fill="#b1b493"/>
  <rect x="528" y="183" width="14" height="4" rx="2" fill="#141416"/>
  <rect x="535" y="172" width="6" height="14" rx="3" fill="#141416"/>
  <rect x="555" y="171" width="200" height="10" rx="3" fill="#6b6b70"/>
  <rect x="555" y="187" width="120" height="8" rx="3" fill="#6b6b70"/>

  <circle cx="535" cy="210" r="12" fill="#2a2a2e" stroke="#6b6b70" stroke-width="2"/>
  <rect x="555" y="205" width="200" height="10" rx="3" fill="#6b6b70"/>
  <rect x="555" y="221" width="160" height="8" rx="3" fill="#6b6b70"/>

  <!-- Traveler info -->
  <rect x="530" y="240" width="250" height="80" rx="10" fill="#141416"/>
  <rect x="550" y="255" width="60" height="10" rx="3" fill="#6b6b70"/>
  <rect x="550" y="275" width="100" height="8" rx="3" fill="#6b6b70"/>
  <rect x="550" y="290" width="80" height="8" rx="3" fill="#6b6b70"/>
  <rect x="660" y="275" width="20" height="24" rx="4" fill="#b1b493" opacity="0.3"/>

  <!-- Action button -->
  <rect x="530" y="340" width="250" height="40" rx="8" fill="#b1b493"/>
  <rect x="585" y="355" width="140" height="10" rx="3" fill="#141416"/>

  <!-- Package details -->
  <rect x="530" y="400" width="250" height="100" rx="10" fill="#141416"/>
  <rect x="550" y="415" width="100" height="10" rx="3" fill="#e4e4e7" opacity="0.9"/>
  <rect x="550" y="430" width="200" height="8" rx="3" fill="#6b6b70"/>
  <rect x="550" y="450" width="180" height="18" rx="4" fill="#b1b493" opacity="0.4"/>
  <rect x="720" y="445" width="40" height="28" rx="6" fill="#b1b493" opacity="0.2"/>
  <rect x="735" y="455" width="10" height="8" rx="2" fill="#b1b493"/>
  <rect x="735" y="470" width="10" height="3" rx="2" fill="#b1b493"/>
</svg>
