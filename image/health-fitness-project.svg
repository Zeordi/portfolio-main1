  <rect x="300" y="425" width="200" height="6" rx="3" fill="#252528"/>
  <rect x="300" y="440" width="180" height="6" rx="3" fill="#252528"/>
  <rect x="300" y="455" width="190" height="6" rx="3" fill="#252528"/>
